spring.application.name=backend

# ==========================================
# 1. Database Connection (Render PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. HikariCP Connection Pool (DB 끊김 및 멈춤 방지)
# ==========================================
# DB 연결이 살아있는지 주기적으로 체크
spring.datasource.hikari.connection-test-query=SELECT 1
# 커넥션 유지 및 타임아웃 설정
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ==========================================
# 3. JPA / Hibernate (SQL 로그 지우기)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# 콘솔 로그를 더럽히는 SQL 쿼리 출력을 끕니다. (false로 설정)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# 4. Security & JWT & Logging
# ==========================================
jwt.secret=investmebackendinvestmebackendinvestmebackend123456
jwt.expiration=3600000
logging.level.org.springframework.security=INFO
