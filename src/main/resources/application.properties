spring.application.name=backend

# ==========================
# Database (Render 환경 변수가 설정되어 있으면 PostgreSQL, 없으면 로컬 H2)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==========================
# JPA Configuration
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# ==========================
# H2 Console (로컬 테스트용)
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# Security & JWT
# ==========================
jwt.secret=investmebackendinvestmebackendinvestmebackend123456
jwt.expiration=3600000
logging.level.org.springframework.security=DEBUG

